name: CI

on: [pull_request]
jobs:
  build:
    name: Run CI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: "24.10.x"

      - name: Install node dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: |
          cp ./config/.env-example .env
          npm run test

      - name: Build app
        run: npm run build

      - name: Install e2e dependencies
        run: cd e2e && npm ci

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: |
          npm start &
          npx --yes wait-on http://localhost:8050 --timeout 30000
          cd e2e && npm run test:local

      - name: Upload e2e test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/playwright-junit.xml

      - name: Publish e2e test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: e2e/playwright-junit.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
