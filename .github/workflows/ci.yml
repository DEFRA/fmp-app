name: CI

on: [pull_request]
jobs:
  build:
    name: Run CI Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: "24.10.x"

      - name: Install node dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: |
          cp ./config/.env-example .env
          npm run test

      - name: Build app
        run: npm run build

      - name: Install e2e dependencies
        run: cd e2e && npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: |
          # Generate a throwaway key so no real key is committed; it takes precedence over the .env value
          export proxyPrivateKey=$(node -e "console.log(require('@defra/fmp-utilities/secureUtils').generateKeys().privateKey)") # NOSONAR
          npm start &
          npx --yes wait-on http://localhost:8050 --timeout 30000
          cd e2e && npm run test:local

      - name: Upload e2e test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            e2e/playwright-report/
            e2e/test-results/

      - name: Publish e2e test results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040
        if: always()
        with:
          files: e2e/test-results/junit.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
